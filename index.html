        function removeEmptyRowsFromPopupContent(content, feature) {

         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');

        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');

// ФУНКЦИЯ ДЛЯ ОПРЕДЕЛЕНИЯ ЛИНИИ ПО НАЗВАНИЮ СТАНЦИИ
function getMetroLine(stationName) {
    if (!stationName) return { name: 'Метро', color: '#0078D7', iconColor: '#0078D7' };
    
    var nameUpper = stationName.toUpperCase().trim();
    
    // Проверяем, входит ли станция в список Ленинской линии
    for (var i = 0; i < leninLineStations.length; i++) {
        if (nameUpper.includes(leninLineStations[i])) {
            return { 
                name: 'Ленинская линия', 
                color: '#D84315', // Оранжево-красный цвет для Ленинской линии
                iconColor: '#FF5722'
            };
        }
    }
    
    // Если не Ленинская, то Дзержинская
    return { 
        name: 'Дзержинская линия', 
        color: '#388E3C', // Зеленый цвет для Дзержинской линии
        iconColor: '#4CAF50'
    };
}

function createMetroIcon(lineInfo) {
    // Путь к вашему растровому файлу маркера
    var iconUrl = 'images/метро.png'; // Замените на путь к вашему файлу
    
    // Определяем размеры иконки

    var iconAnchor = [15, 15]; // Точка привязки (обычно середина нижней грани)
    var popupAnchor = [0, -30]; // Смещение для попапа
    
    // Создаем иконку
    var metroIcon = L.icon({
        iconUrl: iconUrl,
        iconSize: iconSize,
        iconAnchor: iconAnchor,
        popupAnchor: popupAnchor,
        className: 'metro-sign-icon ' + (lineInfo.name === 'Ленинская линия' ? 'lenin-line' : 'dzerzhinsky-line')
    });
    
    return metroIcon;
}
// Вспомогательная функция для осветления цвета
function lightenColor(color, percent) {
    if (!color || color.length < 7) return color;
    
    try {
        var num = parseInt(color.replace("#", ""), 16),
            amt = Math.round(2.55 * percent),
            R = (num >> 16) + amt,
            G = (num >> 8 & 0x00FF) + amt,
            B = (num & 0x0000FF) + amt;
        
        R = R < 255 ? (R < 1 ? 0 : R) : 255;
        G = G < 255 ? (G < 1 ? 0 : G) : 255;
        B = B < 255 ? (B < 1 ? 0 : B) : 255;
        
        return "#" + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
    } catch (e) {
        return color;
    }
}

        // Создаем глобальные функции управления каруселью, если их нет
        if (!window.carouselFunctions) {
            window.carouselFunctions = {};
        }
        
        // Сохраняем состояние карусели
        window.carouselFunctions[carouselId] = {
            currentIndex: 0,
            images: images
        };
        
        // Функции для управления этой конкретной каруселью
        var carouselHTML = `
            <div id="${carouselId}" style="margin: 10px 0; position: relative;">

                         alt="Фотография объекта"

                         onclick="carouselOpenImage('${images[0]}')">
                </div>
                
                ${images.length > 1 ? `
                    <div style="display: flex; justify-content: center; margin-top: 8px; gap: 10px;">
                        <button onclick="carouselPrevImage('${carouselId}')" 
                                style="background: #2196F3; color: white; border: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 13px;">
                            ← Назад
                        </button>
                        <button onclick="carouselNextImage('${carouselId}')" 
                                style="background: #2196F3; color: white; border: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 13px;">
                            Вперед →
                        </button>
                    </div>
                    <div style="text-align: center; margin-top: 5px; font-size: 12px; color: #666;">
                        <span id="${carouselId}_counter">1 из ${images.length}</span>
                    </div>
                ` : ''}
            </div>
        `;
        
        return carouselHTML;
    }
    
    // Глобальные функции для управления каруселью
    if (!window.carouselOpenImage) {
        window.carouselOpenImage = function(src) {
            var modal = document.createElement('div');
            modal.style.position = 'fixed';
            modal.style.zIndex = '9999';
            modal.style.left = '0';
            modal.style.top = '0';
            modal.style.width = '100%';
            modal.style.height = '100%';

            var img = document.createElement('img');

            img.style.borderRadius = '4px';
            img.style.boxShadow = '0 4px 20px rgba(0,0,0,0.5)';
            img.style.cursor = 'default';
            
            modal.appendChild(img);
            
            modal.onclick = function() {
                document.body.removeChild(modal);
            };
            
            document.body.appendChild(modal);
        };
    }
    
    if (!window.carouselPrevImage) {
